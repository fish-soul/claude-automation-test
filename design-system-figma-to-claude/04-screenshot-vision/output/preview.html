<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KRDS Calendar — 방법 4 Screenshot Vision</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #ffffff; font-family: -apple-system, sans-serif; padding: 40px; min-height: 100vh; }
    .page-title { font-size: 20px; font-weight: 700; color: #1e2124; margin-bottom: 6px; }
    .page-sub   { font-size: 14px; color: #6d7882; margin-bottom: 8px; }
    .notice     { font-size: 13px; color: #7a5c00; background: #fffbe6; border: 1px solid #ffe58f; border-radius: 6px; padding: 10px 14px; margin-bottom: 32px; line-height: 1.7; }
    .section-label { font-size: 13px; font-weight: 700; color: #6d7882; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .preview-row   { display: flex; gap: 32px; flex-wrap: wrap; margin-bottom: 48px; }
    .preview-item  { display: flex; flex-direction: column; gap: 12px; }
    .preview-item-label { font-size: 13px; color: #464c53; font-weight: 600; }
    .result-box { padding: 12px 16px; background: #fff; border-radius: 8px; border: 1px solid #e6e8ea; font-size: 14px; color: #1e2124; min-width: 390px; }
    .result-box span { color: #2f74f5; font-weight: 600; }
  </style>
</head>
<body>
  <div class="page-title">KRDS Calendar — 방법 4 Screenshot Vision</div>
  <div class="page-sub">component.png / guide.png / atomic.png 3장만 보고 구현</div>
  <div class="notice">
    ⚠️ <strong>추정값 사용 항목 (스크린샷으로 정확한 수치 확인 불가):</strong><br>
    • 색상: 시각적으로 추정 (예: 선택셀 #063A74 추정 → 실제값 불확실)<br>
    • 치수: 셀 크기·패딩·폰트 크기 등 픽셀 단위 수치 불확실<br>
    • 연도 드롭다운: guide.png에서 플로팅 목록임을 확인, 목록 항목 스타일 추정<br>
    • 월 드롭다운: guide.png에 미노출 — 연도와 동일 패턴으로 추정 구현
  </div>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // ── 스크린샷에서 시각적으로 추정한 색상값 ─────────────────
    // component.png / guide.png / atomic.png 기준
    const T = {
      calBg:        '#EEF2F7', // 달력 배경 — 연한 청회색 추정
      calBorder:    '#C8D5E3', // 외곽선 — 더 진한 청회색 추정
      divider:      '#CDD5DF', // 구분선
      footerBg:     '#ffffff',
      white:        '#ffffff',
      selectedBg:   '#063A74', // 선택 셀 — 짙은 남색 (component.png 기준)
      todayBg:      '#ffffff', // 오늘 셀 — 흰 원
      todayDot:     '#D63D4A', // 오늘 빨간 점 (guide.png 기준)
      dayoffColor:  '#D63D4A', // 일요일/공휴일 — 빨간색 (atomic.png 기준)
      eventColor:   '#256EF4', // 이벤트 날짜 — 파란 밑줄 (atomic.png 기준)
      textBasic:    '#1E2124', // 기본 텍스트
      textSubtle:   '#5A6370', // 보조 텍스트 (월 레이블 등)
      textDisabled: '#B0B8C1', // 비활성 날짜
      textInverse:  '#ffffff',
      arrowBorder:  '#C8D5E3',
      headerBtnPressedBg: '#D0DCEA', // 헤더 버튼 pressed — atomic.png 3번째 상태
      headerBtnHoverBg:   '#EEF2F7',
      btnPrimary:   '#2F74F5', // 선택 버튼 — 파란색 (component.png 기준)
      btnSecBorder: '#6B7280', // 취소 버튼 테두리
      dropdownBg:   '#ffffff',
      dropdownBorder: '#D0D9E3',
      dropdownShadow: '0px 2px 8px rgba(0,0,0,0.10)',
    };

    const DAYS_KO = ['일','월','화','수','목','금','토'];
    const MONTHS_KO = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

    // 치수 — 스크린샷에서 시각적으로 추정
    const CELL_W = 42;       // 셀 크기: 약 42px 추정
    const CAL_W  = 390;      // 달력 전체 너비: 약 390px 추정
    const H_PAD  = 16;       // 좌우 패딩: 약 16px 추정
    const INNER_W = CAL_W - H_PAD * 2; // 358px
    const CELL_STEP = INNER_W / 7;     // ≈ 51.1px
    const cellCenterX = (i) => i * CELL_STEP + CELL_STEP / 2 - CELL_W / 2 + CELL_W / 2;
    // connector용: 셀 i의 중심 x
    const cellCX = (i) => i * CELL_STEP + CELL_STEP / 2;

    function isSameDay(a, b) {
      return a.getFullYear() === b.getFullYear() &&
        a.getMonth() === b.getMonth() &&
        a.getDate() === b.getDate();
    }
    function getDaysInMonth(y, m) { return new Date(y, m+1, 0).getDate(); }
    function getFirstDay(y, m)    { return new Date(y, m, 1).getDay(); }

    function calcRangeConnector(week, sTime, eTime) {
      if (!sTime || !eTime || sTime >= eTime) return null;
      let li = -1, ri = -1;
      for (let i = 0; i < 7; i++) {
        const t = week[i].date.getTime();
        if (!week[i].out && t >= sTime && t <= eTime) {
          if (li === -1) li = i;
          ri = i;
        }
      }
      if (li === -1 || li >= ri) return null;
      return { left: cellCX(li), width: cellCX(ri) - cellCX(li) };
    }

    // ── 화살표 버튼 ────────────────────────────────────────────
    function ArrowBtn({ dir, onClick }) {
      const [hov, setHov] = useState(false);
      return (
        <button onClick={onClick}
          onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
          style={{
            width:32, height:32, borderRadius:999,
            border:`1px solid ${T.arrowBorder}`,
            background: hov ? T.headerBtnHoverBg : 'transparent',
            cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0,
          }}>
          <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
            {dir==='left'
              ? <path d="M7 1.5L3 5L7 8.5" stroke={T.textBasic} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              : <path d="M3 1.5L7 5L3 8.5" stroke={T.textBasic} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>}
          </svg>
        </button>
      );
    }

    // ── 연도/월 드롭다운 ── guide.png: 버튼 바로 아래 플로팅 목록 ──
    function SelectDropdown({ items, selectedValue, onSelect, onClose }) {
      const ref = useRef(null);
      useEffect(() => {
        const h = (e) => { if (ref.current && !ref.current.contains(e.target)) onClose(); };
        document.addEventListener('mousedown', h);
        return () => document.removeEventListener('mousedown', h);
      }, []);
      return (
        <div ref={ref} style={{
          position:'absolute', top:'calc(100% + 2px)', left:0, zIndex:20,
          background: T.dropdownBg,
          border: `1px solid ${T.dropdownBorder}`,
          borderRadius:8,
          boxShadow: T.dropdownShadow,
          minWidth:100, maxHeight:220, overflowY:'auto',
          padding:'4px 0',
        }}>
          {items.map(({label, value}) => {
            const isSel = value === selectedValue;
            return (
              <div key={value} onClick={()=>{ onSelect(value); onClose(); }}
                style={{
                  padding:'8px 16px', cursor:'pointer',
                  fontFamily:"'Pretendard', -apple-system, sans-serif",
                  fontSize:16, lineHeight:1.5,
                  color: T.textBasic,
                  fontWeight: isSel ? 700 : 400,
                  background: isSel ? T.headerBtnHoverBg : 'transparent',
                }}
                onMouseEnter={e=>{ if(!isSel) e.currentTarget.style.background=T.headerBtnHoverBg; }}
                onMouseLeave={e=>{ if(!isSel) e.currentTarget.style.background='transparent'; }}
              >{label}</div>
            );
          })}
        </div>
      );
    }

    // ── 헤더 버튼 ─────────────────────────────────────────────
    function HeaderBtn({ label, isOpen, onClick, dropdown }) {
      const [hov, setHov] = useState(false);
      return (
        <div style={{ position:'relative' }}>
          <button onClick={onClick}
            onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
            style={{
              height:38, padding:'0 8px', borderRadius:6, border:'none', cursor:'pointer',
              background: isOpen ? T.headerBtnPressedBg : hov ? T.headerBtnHoverBg : 'transparent',
              display:'flex', alignItems:'center', gap:4, transition:'background 0.1s',
            }}>
            <span style={{
              fontFamily:"'Pretendard', -apple-system, sans-serif",
              fontSize:18, fontWeight:700, color:T.textBasic,
            }}>{label}</span>
            {/* 아래 화살표 — atomic.png에서 확인 */}
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none"
              style={{ transform: isOpen ? 'rotate(180deg)' : 'none', transition:'transform 0.15s' }}>
              <path d="M2 4L6 8L10 4" stroke={T.textBasic} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </button>
          {isOpen && dropdown}
        </div>
      );
    }

    // ── 날짜 셀 ───────────────────────────────────────────────
    function DayCell({ date, state, isEventDay, onClick, onHover }) {
      const isDisabled   = state === 'disabled';
      const isSelected   = state === 'on';
      const isToday      = state === 'today';
      const isRangeStart = state === 'rangeStart';
      const isRangeEnd   = state === 'rangeEnd';
      const isInRange    = state === 'inRange';
      const isDayoff     = state === 'dayoff'; // atomic.png: 일요일/빨간날

      // border-radius — component.png range 모양 기준
      let br;
      if (isRangeStart)    br = '999px 0 0 999px';
      else if (isRangeEnd) br = '0 999px 999px 0';
      else if (isInRange)  br = 0;
      else                 br = 999;

      const bg = isSelected || isRangeStart || isRangeEnd ? T.selectedBg
        : isToday ? T.todayBg
        : isInRange ? T.white
        : 'transparent';

      const color = isSelected || isRangeStart || isRangeEnd ? T.textInverse
        : isDisabled ? T.textDisabled
        : isDayoff ? T.dayoffColor
        : isEventDay ? T.eventColor
        : T.textBasic;

      return (
        <div onClick={isDisabled ? undefined : onClick}
          onMouseEnter={onHover}
          style={{
            width:CELL_W, height:CELL_W, flexShrink:0,
            borderRadius:br, background:bg,
            cursor: isDisabled ? 'default' : 'pointer',
            display:'flex', flexDirection:'column', alignItems:'center',
            justifyContent: isToday ? 'flex-start' : 'center',
            paddingTop: isToday ? 7 : 0,
            position:'relative', zIndex:1, userSelect:'none',
          }}>
          {/* 날짜 숫자 */}
          <span style={{
            fontFamily:"'Pretendard', -apple-system, sans-serif",
            fontSize:16, fontWeight:400, lineHeight:'24px',
            color,
            textDecoration: isEventDay ? 'underline' : 'none',
            opacity: isDisabled ? 0.5 : 1,
          }}>{date}</span>

          {/* 오늘 빨간 점 — component.png/guide.png 기준 */}
          {isToday && (
            <div style={{ width:4, height:4, borderRadius:999, background:T.todayDot, marginTop:1 }}/>
          )}

          {/* 이벤트 레이블 — atomic.png 기준 */}
          {isEventDay && !isSelected && !isRangeStart && !isRangeEnd && (
            <div style={{
              fontSize:10, color:T.eventColor, lineHeight:'12px',
              fontFamily:"'Pretendard', -apple-system, sans-serif",
            }}>이벤트</div>
          )}
        </div>
      );
    }

    // ── 달력 본체 ──────────────────────────────────────────────
    function Calendar({ type = 'day', eventDays = [], onResult }) {
      const today = new Date();
      const [vy, setVy] = useState(today.getFullYear());
      const [vm, setVm] = useState(today.getMonth());
      const [selected, setSelected]   = useState(null);
      const [rangeStart, setRangeStart] = useState(null);
      const [rangeEnd, setRangeEnd]   = useState(null);
      const [hover, setHover]         = useState(null);
      const [picker, setPicker]       = useState(null);
      const isPeriod = type === 'period';

      const prevMonth = () => { vm===0?(setVy(y=>y-1),setVm(11)):setVm(m=>m-1); };
      const nextMonth = () => { vm===11?(setVy(y=>y+1),setVm(0)):setVm(m=>m+1); };
      const goToday   = () => {
        setVy(today.getFullYear()); setVm(today.getMonth()); setPicker(null);
        if (!isPeriod) setSelected(today);
      };
      const togglePicker = (k) => setPicker(p => p===k ? null : k);

      const handleClick = (date) => {
        if (!isPeriod) {
          setSelected(date);
          onResult?.(`선택: ${date.getFullYear()}.${date.getMonth()+1}.${date.getDate()}`);
        } else {
          if (!rangeStart || (rangeStart && rangeEnd)) {
            setRangeStart(date); setRangeEnd(null); setHover(null);
          } else {
            const s = date < rangeStart ? date : rangeStart;
            const e = date < rangeStart ? rangeStart : date;
            setRangeStart(s); setRangeEnd(e);
            const f = d=>`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
            onResult?.(`기간: ${f(s)} ~ ${f(e)}`);
          }
        }
      };

      const getState = (date, out) => {
        if (out) return 'disabled';
        const effEnd = rangeEnd ?? hover;
        // 일요일 → dayoff (atomic.png 기준)
        const isSunday = date.getDay() === 0;
        if (!isPeriod) {
          if (selected && isSameDay(date, selected)) return 'on';
          if (isSameDay(date, today)) return 'today';
          return isSunday ? 'dayoff' : 'day';
        }
        if (rangeStart && isSameDay(date, rangeStart)) return 'rangeStart';
        if (effEnd && rangeStart && isSameDay(date, effEnd) && !isSameDay(date,rangeStart)) return 'rangeEnd';
        const sT=rangeStart?.getTime(), eT=effEnd?.getTime();
        if (sT&&eT&&date.getTime()>Math.min(sT,eT)&&date.getTime()<Math.max(sT,eT)) return 'inRange';
        if (isSameDay(date, today)) return 'today';
        return isSunday ? 'dayoff' : 'day';
      };

      // 주 배열
      const firstDay = getFirstDay(vy, vm);
      const daysInMonth = getDaysInMonth(vy, vm);
      const prevDays = getDaysInMonth(vy, vm===0?11:vm-1);
      const cells = [];
      for (let i=firstDay-1; i>=0; i--) {
        const m=vm===0?11:vm-1, y=vm===0?vy-1:vy;
        cells.push({date:new Date(y,m,prevDays-i), out:true});
      }
      for (let d=1; d<=daysInMonth; d++) cells.push({date:new Date(vy,vm,d), out:false});
      while (cells.length<42) {
        const d=cells.length-firstDay-daysInMonth+1;
        const m=vm===11?0:vm+1, y=vm===11?vy+1:vy;
        cells.push({date:new Date(y,m,d), out:true});
      }
      const weeks = [];
      for (let i=0; i<42; i+=7) weeks.push(cells.slice(i,i+7));

      const effEnd = rangeEnd ?? (isPeriod&&rangeStart ? hover : null);
      const sTime = rangeStart ? Math.min(rangeStart.getTime(), effEnd?.getTime()??Infinity) : null;
      const eTime = effEnd ? Math.max(rangeStart?.getTime()??0, effEnd.getTime()) : null;
      const fmt = d=>d?`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`:'YYYY.MM.DD';

      return (
        <div style={{
          width:CAL_W, background:T.calBg,
          border:`1px solid ${T.calBorder}`,
          borderRadius:12,
          display:'flex', flexDirection:'column', alignItems:'center',
          overflow:'hidden', paddingTop:14,
          position:'relative',
        }}>

          {/* 헤더 */}
          <div style={{ alignSelf:'stretch', padding:'6px 20px', display:'flex', alignItems:'center', gap:12 }}>
            <ArrowBtn dir="left" onClick={prevMonth}/>
            <div style={{ flex:1, display:'flex', alignItems:'center', justifyContent:'center' }}>
              <HeaderBtn label={`${vy}년`} isOpen={picker==='year'} onClick={()=>togglePicker('year')}
                dropdown={
                  <SelectDropdown
                    items={Array.from({length:11},(_,i)=>({label:`${vy-5+i}년`,value:vy-5+i}))}
                    selectedValue={vy} onSelect={setVy} onClose={()=>setPicker(null)}
                  />
                }
              />
              <HeaderBtn label={`${vm+1}월`} isOpen={picker==='month'} onClick={()=>togglePicker('month')}
                dropdown={
                  <SelectDropdown
                    items={MONTHS_KO.map((n,i)=>({label:n,value:i}))}
                    selectedValue={vm} onSelect={setVm} onClose={()=>setPicker(null)}
                  />
                }
              />
            </div>
            <ArrowBtn dir="right" onClick={nextMonth}/>
          </div>

          {/* 요일 헤더 */}
          <div style={{ alignSelf:'stretch', padding:'8px 16px 0', display:'flex', justifyContent:'space-between' }}>
            {DAYS_KO.map((d,i)=>(
              <div key={d} style={{
                width:CELL_W, textAlign:'center',
                fontFamily:"'Pretendard',-apple-system,sans-serif",
                fontSize:14, fontWeight:400, lineHeight:'22px',
                // 일요일 빨간색 — atomic.png dayoff 기준
                color: i===0 ? T.dayoffColor : T.textBasic,
              }}>{d}</div>
            ))}
          </div>

          {/* 날짜 그리드 */}
          <div style={{ alignSelf:'stretch', padding:'0 16px 14px', display:'flex', flexDirection:'column', gap:2 }}
            onMouseLeave={()=>setHover(null)}>

            {/* 월 레이블 */}
            <div style={{ paddingTop:8, paddingBottom:2 }}>
              <span style={{ fontFamily:"'Pretendard',-apple-system,sans-serif", fontSize:14, fontWeight:700, color:T.textSubtle }}>
                {vy}년 {vm+1}월
              </span>
            </div>

            {weeks.map((week,wi)=>{
              const connector = isPeriod&&sTime&&eTime ? calcRangeConnector(week,sTime,eTime) : null;
              return (
                <div key={wi} style={{ alignSelf:'stretch', position:'relative', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                  {connector && (
                    <div style={{ position:'absolute', top:0, height:CELL_W, left:connector.left, width:connector.width, background:T.white, pointerEvents:'none', zIndex:0 }}/>
                  )}
                  {week.map((cell,di)=>(
                    <DayCell key={di}
                      date={cell.date.getDate()}
                      state={getState(cell.date, cell.out)}
                      isEventDay={!cell.out && eventDays.some(d=>isSameDay(d,cell.date))}
                      onClick={()=>!cell.out&&handleClick(cell.date)}
                      onHover={()=>isPeriod&&rangeStart&&!rangeEnd&&!cell.out?setHover(cell.date):undefined}
                    />
                  ))}
                </div>
              );
            })}
          </div>

          {/* Period 날짜 입력 */}
          {isPeriod && (
            <div style={{ alignSelf:'stretch', padding:14, borderTop:`1px solid ${T.divider}`, background:T.white, display:'flex', gap:8, alignItems:'flex-end' }}>
              {[{label:'시작일',date:rangeStart},{label:'종료일',date:rangeEnd}].map((f,i)=>(
                <React.Fragment key={f.label}>
                  {i===1&&<div style={{width:8,display:'flex',flexDirection:'column',alignItems:'center',paddingBottom:18}}><div style={{height:1,width:'100%',background:T.textSubtle}}/></div>}
                  <div style={{flex:1,display:'flex',flexDirection:'column',gap:6}}>
                    <span style={{fontFamily:"'Pretendard',-apple-system,sans-serif",fontSize:14,color:T.textSubtle}}>{f.label}</span>
                    <div style={{height:38,border:`1px solid ${T.btnSecBorder}`,borderRadius:6,background:T.white,display:'flex',alignItems:'center',padding:'0 14px',fontFamily:"'Pretendard',-apple-system,sans-serif",fontSize:14,color:f.date?T.textBasic:T.textDisabled}}>{fmt(f.date)}</div>
                  </div>
                </React.Fragment>
              ))}
            </div>
          )}

          {/* 푸터 */}
          <div style={{ alignSelf:'stretch', padding:'12px 20px', borderTop:`1px solid ${T.divider}`, background:T.white, display:'flex', alignItems:'center', gap:12 }}>
            <button onClick={goToday} style={{ background:'transparent', border:'none', cursor:'pointer', fontFamily:"'Pretendard',-apple-system,sans-serif", fontSize:14, color:T.textBasic }}>오늘</button>
            <div style={{flex:1, display:'flex', justifyContent:'flex-end', gap:8}}>
              <button style={{ height:38, minWidth:60, padding:'0 12px', borderRadius:6, border:`1px solid ${T.btnSecBorder}`, background:'transparent', cursor:'pointer', fontFamily:"'Pretendard',-apple-system,sans-serif", fontSize:14, color:T.textBasic }}>취소</button>
              <button style={{ height:38, minWidth:60, padding:'0 12px', borderRadius:6, border:'none', background:T.btnPrimary, cursor:'pointer', fontFamily:"'Pretendard',-apple-system,sans-serif", fontSize:14, color:T.textInverse }}>선택</button>
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const today = new Date();
      const [dayResult, setDayResult] = useState('날짜를 선택하세요');
      const [periodResult, setPeriodResult] = useState('기간을 선택하세요');
      const eventDays = [
        new Date(today.getFullYear(), today.getMonth(), 4),
        new Date(today.getFullYear(), today.getMonth(), 15),
      ];
      return (
        <div>
          <div className="section-label">Day 모드</div>
          <div className="preview-row">
            <div className="preview-item">
              <div className="preview-item-label">type="day"</div>
              <Calendar type="day" eventDays={eventDays} onResult={setDayResult}/>
              <div className="result-box">결과: <span>{dayResult}</span></div>
            </div>
          </div>
          <div className="section-label">Period 모드</div>
          <div className="preview-row">
            <div className="preview-item">
              <div className="preview-item-label">type="period"</div>
              <Calendar type="period" onResult={setPeriodResult}/>
              <div className="result-box">결과: <span>{periodResult}</span></div>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
